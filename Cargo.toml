[workspace]
resolver = "2"
members = ["sim", "calib", "sim-wasm", "bots", "sim-ffi"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
libm = "0.2"

[profile.release]
debug = false

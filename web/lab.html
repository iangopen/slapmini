<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>slapmini feel lab</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="rink"></canvas>
    <div id="lock-hint" class="lock-hint" hidden>Click the rink to capture the mouse · left/right turns the stick · Esc releases it</div>
    <aside id="panel">
      <h1><a href="./index.html" class="back">← menu</a> feel lab</h1>
      <section id="readout"></section>
      <section>
        <h2>Match</h2>
        <div class="row"><label><input id="match-mode" type="checkbox" /> Match mode (1v1 rules, practice tools off)</label></div>
        <div class="row"><button id="match-restart" disabled>New match</button></div>
        <div id="match-info" class="muted">free play (no rules)</div>
      </section>
      <section>
        <h2>Record / replay</h2>
        <div class="row">
          <button id="rec">Record</button>
          <button id="replay" disabled>Replay</button>
        </div>
        <div class="row">
          <button id="dl-scenario" disabled>Scenario .json</button>
          <button id="dl-csv" disabled>Trajectory .csv</button>
        </div>
        <div class="row"><label>Load scenario <input id="load-scenario" type="file" accept=".json" /></label></div>
        <div id="rec-status" class="muted"></div>
      </section>
      <section>
        <h2>View</h2>
        <div class="row"><label><input id="puck-min" type="checkbox" checked /> Minimum puck size 6 px (display only; off = true scale)</label></div>
        <div class="row"><label><input id="game-view" type="checkbox" checked /> Rink vertical (BLUE attacks the top net; off = the old horizontal view)</label></div>
      </section>
      <section>
        <h2>Mouse</h2>
        <div class="row">
          <select id="mouse-mode">
            <option value="relative">Relative (click the rink to capture; left/right turns the stick)</option>
            <option value="cursor">Cursor aim (the stick points at the cursor)</option>
          </select>
        </div>
        <div class="row"><input id="sensitivity" type="range" /> <span id="sens-value" class="muted"></span></div>
        <div class="muted">Esc releases the mouse. While captured, F/G use the last cursor position.</div>
      </section>
      <section>
        <h2>Ghost</h2>
        <div class="row"><input id="ghost-file" type="file" accept=".csv" /></div>
        <div class="row"><input id="ghost-scrub" type="range" min="0" max="0" value="0" disabled /> <span id="ghost-t">–</span></div>
        <div class="row"><button id="ghost-clear" disabled>Clear ghost</button></div>
      </section>
      <section>
        <h2>Practice tools <span class="badge approx">approximate</span></h2>
        <ul class="muted keys" id="keys"></ul>
      </section>
      <section>
        <h2>Params</h2>
        <div id="params"></div>
      </section>
    </aside>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
